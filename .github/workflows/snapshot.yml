name: Snapshot

on:
  schedule:
    - cron: '17 * * * *'   # hourly, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh devnet snapshot (auto-picks a tx with REX edges when one exists)
        run: npm run inspector -- 262drMzXMehx5BJnK8jH6EFksYyfMJSYKYm5VD9Nq7PW --auto

      - name: Verify the generated page
        run: npm run test:ui

      - name: Commit the new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "no snapshot change"
            exit 0
          fi
          git add index.html
          git commit -m "chore: refresh devnet snapshot [skip ci]"
          git push
